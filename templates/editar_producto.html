{% extends 'base.html' %}
{% block title %}Editar {{ producto['nombre'] }} · Stock Claro{% endblock %}
{% block content %}
<div class="page-heading">
    <div><h1>Editar producto ✏️</h1><p>El stock se modifica desde compras, ventas o ajustes.</p></div>
    <a class="btn btn-secondary" href="{{ url_for('productos') }}">← Volver</a>
</div>
<section class="card" style="max-width:760px;margin:0 auto">
    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="field">
                <label for="nombre">Nombre *</label>
                <input id="nombre" name="nombre" maxlength="150" value="{{ producto['nombre'] }}" required autofocus>
            </div>
            <div class="field">
                <label for="categoria">Categoría *</label>
                <input id="categoria" name="categoria" maxlength="100" value="{{ producto['categoria'] }}" required>
            </div>
            <div class="field">
                <label for="precio">Precio por unidad *</label>
                <input id="precio" type="number" step="0.01" min="0" name="precio" value="{{ producto['precio'] }}" required>
            </div>
            <div class="field">
                <label for="codigo_barras">Código de barras</label>
                <input id="codigo_barras" name="codigo_barras" maxlength="80" value="{{ producto['codigo_barras'] or '' }}">
            </div>
            <div class="field">
                <label for="stock_minimo">Avisarme cuando queden</label>
                <input id="stock_minimo" type="number" min="0" name="stock_minimo" value="{{ producto['stock_minimo'] }}" required>
            </div>
            <div class="field">
                <label for="descripcion">Descripción</label>
                <input id="descripcion" name="descripcion" maxlength="1000" value="{{ producto['descripcion'] or '' }}">
            </div>
        </div>
        <div class="form-footer">
            <a class="btn btn-secondary" href="{{ url_for('productos') }}">Cancelar</a>
            <button class="btn" type="submit">Guardar cambios ✓</button>
        </div>
    </form>
</section>
{% endblock %}
