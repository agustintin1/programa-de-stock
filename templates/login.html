{% extends 'base.html' %}
{% block title %}Ingresar · Stock Claro{% endblock %}
{% block content %}
<div class="auth-shell">
    <section class="card auth-card">
        <div class="auth-brand"><span class="auth-mark">👋</span><span><strong>Stock Claro</strong><small>Tu inventario, al día</small></span></div>
        <h1>¡Qué bueno verte!</h1>
        <p class="muted">Ponte cómodo. Tu inventario te está esperando.</p>
        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="usuario">Usuario</label>
                <input id="usuario" name="usuario" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit" style="width:100%">Ingresar y empezar →</button>
        </form>
        <p class="auth-note">🔒 Un espacio seguro para ti y tu equipo.</p>
    </section>
</div>
{% endblock %}
