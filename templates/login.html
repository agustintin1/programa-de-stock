{% extends 'base.html' %}
{% block title %}Ingresar · Stock Claro{% endblock %}
{% block content %}
<div class="auth-shell">
    <section class="card auth-card">
        <div class="auth-mark">👋</div>
        <h1>¡Qué bueno verte!</h1>
        <p class="muted">Ingresa para revisar y mover el inventario.</p>
        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="usuario">Usuario</label>
                <input id="usuario" name="usuario" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit" style="width:100%">Ingresar →</button>
        </form>
    </section>
</div>
{% endblock %}
