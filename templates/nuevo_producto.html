{% extends 'base.html' %}

{% block title %}Nuevo Producto - Control de Stock{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem;">Registrar Nuevo Producto ➕</h2>

    <div class="card">
        <form action="/productos/nuevo" method="POST">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Nombre del Producto:</label>
                <input type="text" name="nombre" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Descripción:</label>
                <textarea name="descripcion" rows="3" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); box-sizing: border-box; font-family: inherit;"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Precio ($):</label>
                    <input type="number" step="0.01" name="precio" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); box-sizing: border-box;">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Stock Inicial:</label>
                    <input type="number" name="stock" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); box-sizing: border-box;">
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Categoría:</label>
                <input type="text" name="categoria" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); box-sizing: border-box;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                <a href="/productos" style="background-color: #cbd5e1; color: var(--primary); padding: 0.75rem 1.5rem; border-radius: var(--radius); text-decoration: none; font-weight: 600; display: inline-block;">Cancelar</a>
                <button type="submit" class="btn">Guardar Producto</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
