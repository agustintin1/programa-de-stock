{% extends 'base.html' %}
{% block title %}Agregar producto · Stock Claro{% endblock %}
{% block content %}
<div class="page-heading">
    <div><h1>Un producto nuevo 🌱</h1><p>Completa lo básico. Luego puedes registrar compras y ventas.</p></div>
    <a class="btn btn-secondary" href="{{ url_for('productos') }}">← Volver</a>
</div>
<section class="card" style="max-width:760px;margin:0 auto">
    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="field">
                <label for="nombre">Nombre del producto *</label>
                <input id="nombre" name="nombre" maxlength="150" placeholder="Ej.: Auriculares inalámbricos" required autofocus>
            </div>
            <div class="field">
                <label for="categoria">Categoría *</label>
                <input id="categoria" name="categoria" maxlength="100" placeholder="Ej.: Electrónica" required>
            </div>
            <div class="field">
                <label for="precio">Precio por unidad *</label>
                <input id="precio" type="number" step="0.01" min="0" name="precio" placeholder="0.00" required>
            </div>
            <div class="field">
                <label for="codigo_barras">Código de barras <span class="muted">(opcional)</span></label>
                <input id="codigo_barras" name="codigo_barras" maxlength="80" placeholder="Escanea o escribe el código">
            </div>
            <div class="field">
                <label for="stock">Cantidad inicial</label>
                <input id="stock" type="number" min="0" name="stock" value="0" required>
                <span class="hint">Este ingreso también queda registrado en el historial.</span>
            </div>
            <div class="field">
                <label for="stock_minimo">Avisarme cuando queden</label>
                <input id="stock_minimo" type="number" min="0" name="stock_minimo" value="5" required>
            </div>
            <div class="field">
                <label for="ubicacion_id">Depósito inicial *</label>
                <select id="ubicacion_id" name="ubicacion_id" required>
                    {% for ubicacion in ubicaciones %}
                    <option value="{{ ubicacion['id'] }}" {% if ubicacion['id'] == ubicacion_id %}selected{% endif %}>{{ ubicacion['nombre'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="descripcion">Descripción <span class="muted">(opcional)</span></label>
                <input id="descripcion" name="descripcion" maxlength="1000" placeholder="Tamaño, color, detalles...">
            </div>
        </div>
        <div class="form-footer">
            <a class="btn btn-secondary" href="{{ url_for('productos') }}">Cancelar</a>
            <button class="btn" type="submit">Guardar producto ✓</button>
        </div>
    </form>
</section>
{% endblock %}
